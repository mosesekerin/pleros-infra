---
- name: App directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0750"

- name: Get the app code (public repo, read-only clone)
  become: true
  become_user: "{{ admin_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dir }}/src"
    version: "{{ app_repo_version }}"
    force: true
  register: app_code

- name: App environment file (secrets from the vault, readable only by the admin user)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  no_log: true
  register: app_env

- name: Caddy config directory (mounted as a directory so edits reach the container)
  ansible.builtin.file:
    path: "{{ app_dir }}/caddy"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"

- name: Dockerfile, ignore file, Compose file and Caddyfile
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ app_dir }}/{{ item.dest }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop:
    - { src: Dockerfile.j2, dest: Dockerfile }
    - { src: Dockerfile.dockerignore.j2, dest: Dockerfile.dockerignore }
    - { src: compose.yml.j2, dest: compose.yml }
    - { src: Caddyfile.j2, dest: caddy/Caddyfile }
  register: app_files

- name: Build the app image (only when code, secrets or build files changed)
  when: app_code.changed or app_env.changed or app_files.changed or (force_rebuild | default(false) | bool)
  ansible.builtin.command:
    cmd: docker compose build app
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Start or update containers
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ app_dir }}"
  register: app_compose_up
  changed_when: app_compose_up.stderr is search('Recreated|Created|Started')

- name: Reload Caddy config if the Caddyfile changed
  when: app_files.results | selectattr('item.dest', 'equalto', 'caddy/Caddyfile') | selectattr('changed') | list | length > 0
  ansible.builtin.command:
    cmd: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Wait until the app answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/"
    status_code: [200, 301, 302, 307, 308]
    follow_redirects: none
  register: app_health
  until: app_health.status in [200, 301, 302, 307, 308]
  retries: 30
  delay: 5

- name: Remove old unused images (frees disk)
  ansible.builtin.command: docker image prune -f
  register: app_prune
  changed_when: "'Total reclaimed space: 0B' not in app_prune.stdout"
