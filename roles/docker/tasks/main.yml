---
- name: Docker apt repository (with Docker's signing key)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Rotate container logs so they can't fill the disk
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "5" }
      }
    mode: "0644"
  notify: Restart docker

- name: Let the admin user run docker
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
